<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfólio de Lucas Medeiros, desenvolvedor Full Stack especializado em dados, web e IA." />
  <meta name="author" content="Lucas Medeiros" />
  <meta name="theme-color" content="#0c0704" />
  <meta property="og:title" content="Lucas Medeiros | Desenvolvedor Full Stack" />
  <meta property="og:description" content="Portfólio interativo — uma jornada contada em código." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./assets/og-preview.jpg" />
  <title>Lucas Medeiros | Desenvolvedor Full Stack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/css/page-flip.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
</head>
<body>

  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <defs>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f0d080"/>
        <stop offset="50%" stop-color="#c9933a"/>
        <stop offset="100%" stop-color="#8a5a18"/>
      </linearGradient>
      <radialGradient id="goldFill" cx="40%" cy="35%">
        <stop offset="0%" stop-color="#ffe8a8"/>
        <stop offset="100%" stop-color="#a07020"/>
      </radialGradient>
      <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f5e0a0"/>
        <stop offset="50%" stop-color="#d4a84a"/>
        <stop offset="100%" stop-color="#7a5018"/>
      </linearGradient>
      <radialGradient id="emblemFill" cx="35%" cy="30%">
        <stop offset="0%" stop-color="#fff0c0"/>
        <stop offset="60%" stop-color="#d4a030"/>
        <stop offset="100%" stop-color="#6a4010"/>
      </radialGradient>
    </defs>
  </svg>

  <div class="study" aria-hidden="true">
    <div class="study-wood"></div>
    <div class="candlelight"></div>
    <div class="vignette"></div>
  </div>

  <div class="dust-container" id="dustContainer"></div>

  <main class="scene">

    <div class="scene-props" aria-hidden="true">
      <div class="candle">
        <div class="candle-holder"></div>
        <div class="candle-wax"></div>
        <div class="candle-flame"></div>
        <div class="candle-glow"></div>
      </div>
      <div class="parchment parchment-a"></div>
      <div class="parchment parchment-b"></div>
      <div class="bowl"></div>
    </div>

    <div class="desk-stage">
      <div class="book-contact-shadow"></div>

      <div class="book-wrapper" id="bookWrapper">

        <!-- LIVRO FECHADO -->
        <div class="book-closed" id="bookClosed">
          <div class="spine">
            <span class="spine-rib"></span>
            <span class="spine-rib"></span>
            <span class="spine-rib"></span>
            <span class="spine-rib"></span>
            <span class="spine-rib"></span>
          </div>
          <div class="back-cover">
            <div class="cover-texture"></div>
            <div class="back-cover-inner">
              <div class="back-ornament"></div>
              <p class="back-tagline">Uma jornada contada em código</p>
              <div class="back-ornament"></div>
            </div>
          </div>
          <div class="front-cover" id="frontCover">
            <div class="cover-back-face" aria-hidden="true"></div>
            <div class="cover-face cover-front-face">
              <div class="cover-texture"></div>
              <div class="cover-wear"></div>
              <div class="cover-highlight"></div>
              <div class="cover-corners" aria-hidden="true">
                <svg class="corner corner-tl" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 4 H44 V12 H16 V44 H4 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
                  <path d="M4 4 L20 20" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
                  <circle cx="10" cy="10" r="2.5" fill="url(#goldFill)"/>
                </svg>
                <svg class="corner corner-tr" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
                  <path d="M52 4 H12 V12 H40 V44 H52 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
                  <path d="M52 4 L36 20" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
                  <circle cx="46" cy="10" r="2.5" fill="url(#goldFill)"/>
                </svg>
                <svg class="corner corner-bl" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 52 H44 V44 H16 V12 H4 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
                  <path d="M4 52 L20 36" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
                  <circle cx="10" cy="46" r="2.5" fill="url(#goldFill)"/>
                </svg>
                <svg class="corner corner-br" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
                  <path d="M52 52 H12 V44 H40 V12 H52 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
                  <path d="M52 52 L36 36" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
                  <circle cx="46" cy="46" r="2.5" fill="url(#goldFill)"/>
                </svg>
              </div>
              <svg class="cover-emblem" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="60" cy="60" r="54" fill="none" stroke="url(#emblemGold)" stroke-width="1.2" opacity="0.7"/>
                <circle cx="60" cy="60" r="38" fill="none" stroke="url(#emblemGold)" stroke-width="0.8" opacity="0.5"/>
                <g stroke="url(#emblemGold)" stroke-width="1" fill="none" opacity="0.85">
                  <line x1="60" y1="8" x2="60" y2="28"/><line x1="60" y1="92" x2="60" y2="112"/>
                  <line x1="8" y1="60" x2="28" y2="60"/><line x1="92" y1="60" x2="112" y2="60"/>
                  <line x1="22" y1="22" x2="36" y2="36"/><line x1="98" y1="98" x2="84" y2="84"/>
                  <line x1="98" y1="22" x2="84" y2="36"/><line x1="22" y1="98" x2="36" y2="84"/>
                </g>
                <polygon points="60,18 66,42 90,42 70,56 78,80 60,66 42,80 50,56 30,42 54,42" fill="url(#emblemFill)" opacity="0.9"/>
                <circle cx="60" cy="60" r="8" fill="url(#emblemFill)"/>
              </svg>
              <div class="cover-inner">
                <div class="cover-ornament">
                  <div class="orn-line"></div>
                  <span class="orn-sym">◆ ✦ ◆</span>
                  <div class="orn-line"></div>
                </div>
                <p class="cover-subtitle">Portfólio de Jornada</p>
                <h1 class="cover-title">Crônicas de um<br>Desenvolvedor</h1>
                <div class="cover-divider"></div>
                <p class="cover-author">Lucas Medeiros</p>
                <button type="button" class="open-btn" id="openBtn">
                  ✦ &nbsp;Abrir o Livro&nbsp; ✦
                </button>
                <div class="cover-ornament bottom">
                  <div class="orn-line"></div>
                  <span class="orn-sym">◆ ✦ ◆</span>
                  <div class="orn-line"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- fim .book-closed -->

        <!-- LIVRO ABERTO -->
        <div class="book-open" id="bookOpen">
          <div id="pageFlipBook" class="page-flip-book" aria-label="Páginas do livro"></div>
        </div>
        <!-- fim .book-open -->

      </div>
      <!-- fim .book-wrapper -->

      <!--
        Botão fechar FORA do book-wrapper, dentro do desk-stage.
        Fluxo normal do documento — sem posicionamento absoluto problemático.
        Aparece/some via CSS quando .is-open é adicionado ao bookWrapper.
      -->
      <button type="button" id="closeBtn" class="close-btn" aria-label="Fechar o livro">
        ✦ &nbsp;Fechar o Livro&nbsp; ✦
      </button>

    </div>
    <!-- fim .desk-stage -->

  </main>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="pages-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
