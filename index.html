<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crônicas de um Desenvolvedor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Partículas de poeira -->
  <div class="dust-container" id="dustContainer"></div>

  <main class="scene">

    <section class="book-wrapper">

      <!-- Capa -->
      <div class="book-cover" id="bookCover">
        <div class="cover-emboss"></div>
        <div class="cover-inner">
          <div class="cover-ornament top"></div>
          <p class="cover-subtitle">Portfólio de Jornada</p>
          <h1 class="cover-title">Crônicas de um<br>Desenvolvedor</h1>
          <div class="cover-divider"></div>
          <p class="cover-author">Lucas Medeiros</p>
          <button class="open-button" id="openBookButton">
            <span class="open-button-text">Abrir o Livro</span>
          </button>
          <div class="cover-ornament bottom"></div>
        </div>
        <!-- Lombada -->
        <div class="book-spine"></div>
      </div>

      <!-- Páginas do livro -->
      <div class="book-pages" id="bookPages">

        <!-- Sombra central (lombada) -->
        <div class="page-gutter"></div>

        <!-- Página esquerda atual -->
        <article class="page left-page" id="leftPage">
          <div class="page-content-inner">
            <span class="chapter-label" id="chapterLabel">Prólogo</span>
            <h2 class="page-title" id="pageTitle">O Início da Jornada</h2>
            <div class="page-divider"></div>
            <p class="page-body" id="pageContent">
              Toda jornada começa antes mesmo do herói entender o chamado.
            </p>
          </div>
          <div class="page-number left-num" id="pageNumLeft">i</div>
        </article>

        <!-- Página direita atual -->
        <article class="page right-page" id="rightPage">
          <div class="page-content-inner">
            <h3 class="side-title" id="sideTitle">Notas da Jornada</h3>
            <div class="page-divider"></div>
            <p class="page-body" id="sideContent">
              Aqui ficarão os detalhes, projetos, tecnologias e conquistas.
            </p>
          </div>
          <div class="page-number right-num" id="pageNumRight">ii</div>
        </article>

        <!-- Página virando (frente e verso) -->
        <div class="flip-wrapper" id="flipWrapper">
          <div class="flip-page" id="flipPage">
            <div class="flip-front" id="flipFront"></div>
            <div class="flip-back" id="flipBack"></div>
          </div>
          <div class="flip-shadow" id="flipShadow"></div>
        </div>

      </div>

    </section>

    <!-- Navegação -->
    <nav class="navigation">
      <button class="nav-btn" id="prevButton" disabled>
        <span class="nav-arrow">◄</span>
        <span>Página anterior</span>
      </button>
      <span class="page-indicator" id="pageIndicator">I / IV</span>
      <button class="nav-btn" id="nextButton">
        <span>Próxima página</span>
        <span class="nav-arrow">►</span>
      </button>
    </nav>

  </main>

  <script src="script.js"></script>
</body>
</html>
